# 发版流水线:推送 v* tag 触发。
# GoReleaser 跨平台构建 → GitHub Release(二进制 + 校验和 + changelog)+ ghcr.io 多架构镜像。
# 与 ci.yml(每次 push/PR 跑测试)正交;此处只在打 tag 时跑。
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # 创建 GitHub Release、上传产物
  packages: write # 推送镜像到 ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # GoReleaser 需要完整历史与 tag 生成 changelog

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # 多架构镜像构建所需:QEMU(跨架构模拟)+ buildx。
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # 登录 ghcr.io,用 workflow 自带 GITHUB_TOKEN,无需额外配置密钥。
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 发版后把 ghcr.io 包设为公开:否则匿名 docker pull 会 401(unauthorized)。
      # 关键:工作流用 GITHUB_TOKEN 推送的镜像,包会挂在「仓库(repository)」名下(repo-linked),
      # 必须用 /repos/{owner}/{repo}/packages 端点;org 端点对 repo-linked 包会返回伪 204 而不生效。
      # 最后用匿名 registry 轮询自校验:返回 200 即公开生效,否则明确报错(GITHUB_TOKEN 可能无权改可见性)。
      - name: make ghcr package public
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OWNER="atomlust"
          REPO="atomgo"
          PKG="atomgo"

          # 1) 优先 repo-linked 端点(工作流推送的包归属仓库,这是正确端点)
          set +e
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X PATCH \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$OWNER/$REPO/packages/container/$PKG/visibility" \
            -d '{"visibility":"public"}')
          echo "repo endpoint -> HTTP $code"

          # 2) 兜底:org 端点(部分命名空间直接归 org 所有)
          if [ "$code" != "204" ]; then
            code=$(curl -sS -o /dev/null -w "%{http_code}" -X PATCH \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/orgs/$OWNER/packages/container/$PKG/visibility" \
              -d '{"visibility":"public"}')
            echo "org endpoint -> HTTP $code"
          fi
          set -e

          # 3) 自校验:匿名访问 ghcr manifest,200=公开,401=仍私有
          for i in $(seq 1 12); do
            v=$(curl -sS -o /dev/null -w "%{http_code}" \
              -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/$OWNER/$PKG/manifests/${GITHUB_REF_NAME#v}")
            echo "verify attempt $i -> HTTP $v"
            [ "$v" = "200" ] && { echo "ghcr package is now PUBLIC"; exit 0; }
            sleep 10
          done
          echo "::error::ghcr package still private after PATCH. GITHUB_TOKEN may lack permission to change repo/org package visibility — use a PAT (write:packages) or set public manually in GitHub UI (Packages → atomgo → Settings → Public)."
          exit 1
